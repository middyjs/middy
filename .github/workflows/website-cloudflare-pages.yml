name: Publish Website to CloudFlare Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "websites/**"
    branches:
      - main

env:
  NODE_VERSION: 24.22.3
  DOMAIN_NAME: middy.js.org

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Publish website
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            sparrow.cloudflare.com:443
            workers.cloudflare.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # deployed artifacts must never touch the shared Actions cache
      - name: Set env
        # A pre-release stays off the live site, same rule as release.yml.
        run: |
          tag=$(npm pkg get version | xargs)
          prerelease=$([ "${tag##*-*}" ] && echo false || echo true)
          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_ENV"
          echo "${tag}: prerelease=${prerelease}"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        if: ${{ env.prerelease == 'false' }}
        run: |
          npm ci --ignore-scripts --workspace "websites/${DOMAIN_NAME}"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build website
        if: ${{ env.prerelease == 'false' }}
        working-directory: websites/${{ env.DOMAIN_NAME }}
        run: |
          npm run build
      # allowed-endpoints: >
      #   api.cloudflare.com:443
      #   registry.npmjs.org:443
      #   sparrow.cloudflare.com:443
      #   workers.cloudflare.com:443
      - name: Publish website
        if: ${{ env.prerelease == 'false' }}
        working-directory: websites/${{ env.DOMAIN_NAME }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run release:deploy
