name: Publish Website to CloudFlare Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "websites/**"
    branches:
      - main

env:
  NODE_VERSION: 24.x
  DOMAIN_NAME: middy.js.org

permissions:
  contents: read

jobs:
  website:
    name: Publish website
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning] no cache configured (no `cache:` input); reconsider if caching is added
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --workspace websites/${{ env.DOMAIN_NAME }}
      - name: Build website
        working-directory: websites/${{ env.DOMAIN_NAME }}
        run: |
          npm run build
      - name: Publish website
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          workingDirectory: websites/${{ env.DOMAIN_NAME }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            pages deploy
