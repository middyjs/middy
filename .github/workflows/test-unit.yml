name: Tests (unit)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tests (unit) (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - line: 24.x
            node-version: 24.22.3
          - line: 26.x
            node-version: 26.13.1

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            truststore.pki.rds.amazonaws.com:443
            truststore.pki.us-gov-west-1.rds.amazonaws.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   truststore.pki.rds.amazonaws.com:443
      #   truststore.pki.us-gov-west-1.rds.amazonaws.com:443
      - name: Build
        # packages/rds/certificates is a gitignored build output that
        # `npm ci --ignore-scripts` above skipped. It downloads from the AWS
        # truststore, so a network failure must not fail the PR: every region
        # it did not write is skipped by packages/rds/certificates.test.js.
        continue-on-error: true
        run: |
          npm run build --workspace packages/rds
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Unit tests
        run: |
          export NODE_OPTIONS="--test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/reporters/node-test.mjs --test-reporter-destination=$GITHUB_STEP_SUMMARY"
          npm run test:unit
      - name: Option schema SAST
        # sast-json-schema requires Node.js >= 26.
        if: matrix.line == '26.x'
        run: |
          npm run test:sast:option-schema
