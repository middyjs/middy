name: tardisec
on:
  schedule:
    - cron: "52 21 * * 3"
  workflow_dispatch: {}

env:
  NODE_VERSION: 24.x

permissions: {}
concurrency:
  group: tardisec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync config
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # mint the OIDC token tardisec verifies
      contents: write       # push the sync branch
      pull-requests: write  # open the PR
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.tardisec.com:443
            nodejs.org:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts # biome, from the integrity-checked lockfile
      - uses: tardisec/integration-github-action@79a37c4a612483144768e0eb020b2b7236268862 # main, no tagged releases upstream
        with:
          domain: middy.js.org
          path: /websites/middy.js.org
          files: |
            .tardisec.json
            .tardisec.sveltekit.json
          format: npm run lint
