name: Release

on:
  pull_request:
    types: [closed]
    # Maintenance branches (`7.x`) release the same way, see docs/RELEASE.md.
    branches: [main, '[0-9]+.x']
    paths:
      - 'package.json'

env:
  NODE_VERSION: 24.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            truststore.pki.rds.amazonaws.com:443
            truststore.pki.us-gov-west-1.rds.amazonaws.com:443
            tuf-repo-cdn.sigstore.dev:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Set env
        # `latest` only moves forward: a stable version at or above the
        # registry's current one. A maintenance release (7.x after 8.0.0) is
        # staged under its major-line dist-tag, a pre-release under `next`.
        run: |
          tag=$(npm pkg get version | xargs)
          prerelease=$([ "${tag##*-*}" ] && echo false || echo true)
          dist_tag=next
          if [ "$prerelease" = "false" ]; then
            current=$(npm view @middy/core version)
            if [ "$(printf '%s\n' "$current" "$tag" | sort -V | tail -n 1)" = "$tag" ]; then
              dist_tag=latest
            else
              dist_tag="${tag%%.*}.x"
            fi
          fi
          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "dist_tag=${dist_tag}"
          } >> "$GITHUB_ENV"
          echo "${tag}: prerelease=${prerelease} dist-tag=${dist_tag}"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Verify dependency signatures
        run: |
          npm audit signatures
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      #   truststore.pki.rds.amazonaws.com:443
      #   truststore.pki.us-gov-west-1.rds.amazonaws.com:443
      - name: Build
        # Per published workspace rather than `--workspaces`: the root has no
        # build script and the website workspace has one that must not run
        # here. Today only rds builds (its certificates/ modules), which
        # `npm ci --ignore-scripts` above skipped.
        run: |
          mapfile -t args < <(npm query '.workspace:not([private])' | jq -r '.[] | "--workspace", .location')
          npm run build "${args[@]}" --if-present
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Verify workspace versions
        run: |
          version=$(npm pkg get version | tr -d '"')
          workspaces=$(npm query '.workspace:not([private])')
          if ! jq -e --arg v "$version" 'all(.[]; .version == $v)' <<< "$workspaces" > /dev/null; then
            echo "::error::workspaces not at ${version} (run npm run release:sync):"
            jq -r --arg v "$version" '.[] | select(.version != $v) | "\(.name)@\(.version)"' <<< "$workspaces"
            exit 1
          fi
          if ! jq -e '[.packages | keys[] | select(test("packages/.*/node_modules/@middy"))] | length == 0' package-lock.json > /dev/null; then
            echo "::error::package-lock.json resolves @middy/* from the registry instead of the workspace (run npm install):"
            jq -r '.packages | keys[] | select(test("packages/.*/node_modules/@middy"))' package-lock.json
            exit 1
          fi
          echo "all $(jq length <<< "$workspaces") workspaces at ${version}"
      - name: Verify rds certificates
        # packages/rds/certificates is a gitignored build output that backs 35
        # `./certificates/<region>` export subpaths. A pack from a checkout
        # whose build was skipped would ship every one of them dangling.
        run: |
          count=0
          types=0
          if [ -d packages/rds/certificates ]; then
            count=$(find packages/rds/certificates -name '*.js' | wc -l | tr -d ' ')
            types=$(find packages/rds/certificates -name '*.d.ts' | wc -l | tr -d ' ')
          fi
          if [ "$count" -lt 35 ] || [ "$types" -ne "$count" ]; then
            echo "::error::packages/rds/certificates has ${count} modules and ${types} declarations, expected at least 35 of each (run npm run build --workspace packages/rds)"
            exit 1
          fi
          echo "packages/rds/certificates: ${count} modules, ${types} declarations"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Pack
        id: pack
        run: |
          mapfile -t args < <(npm query '.workspace:not([private])' | jq -r '.[] | "--workspace", .location')
          # npm only ships a LICENSE that sits inside the package directory.
          for dir in packages/*/; do cp LICENSE "$dir"; done
          {
            echo "packages<<EOF"
            npm pack "${args[@]}" --json
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: Build Attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            **/*.tgz
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.tag }}
          path: |
            *.tgz
    outputs:
      tag: ${{ env.tag }}
      prerelease: ${{ env.prerelease }}
      dist_tag: ${{ env.dist_tag }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write # softprops/action-gh-release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   uploads.github.com:443
      - name: Release
        # Replaces actions/create-release & actions/upload-release-asset (deprecated)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.0 # zizmor: ignore[superfluous-actions] prefer maintained action over inline `gh release` script
        with:
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          # Disabled, covered by GitHub Attestations & npm
          #files: |
          #  **/*.tgz
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      dist_tag: ${{ needs.build.outputs.dist_tag }}

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: npm-publish

    permissions:
      contents: read
      id-token: write # npm publish
      attestations: read # gh attestation verify
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   tmaproduction.blob.core.windows.net:443
      #   tuf-repo-cdn.sigstore.dev:443
      #   tuf-repo.github.com:443
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in ./*.tgz; do
            echo "$f"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --format json || exit 1
          done
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   registry.npmjs.org:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: npm stage publish
        env:
          DIST_TAG: ${{ needs.release.outputs.dist_tag }} # latest, next or the major line (7.x), chosen in Build
        run: |
          [ -n "$DIST_TAG" ] || { echo "::error::dist_tag not set by the Build job"; exit 1; }
          mkdir -p staged
          for f in ./*.tgz; do
            npm stage publish --tag "$DIST_TAG" --provenance --access public --ignore-scripts --json "$f" > "staged/$(basename "$f" .tgz).json" || exit 1
          done
          jq -s -r 'map(to_entries[].value) | .[] | "\(.name)@\(.version) staged with id \(.stageId)"' staged/*.json
