name: Tests (mutation)

on:
  pull_request:

env:
  NODE_VERSION: 24.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: List packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List packages
        id: list
        # One matrix leg per package directory that has an index.js; stale
        # directories left behind by removed packages are skipped.
        run: |
          packages=$(for d in packages/*/; do [ -f "${d}index.js" ] && basename "$d"; done | jq -R . | jq -c -s .)
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "$packages" | jq -r '"\(length) packages: \(join(" "))"'

  package:
    name: Tests (mutation) (${{ matrix.package }})
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build
        run: |
          npm run build --if-present
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Mutation tests
        env:
          MUTATE_PACKAGE: ${{ matrix.package }}
        run: |
          npm run test:mutation

  # Single required status check; fails when any matrix leg failed, was
  # cancelled, or was skipped because the package list could not be built.
  mutation:
    name: Tests (mutation)
    needs: package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
      - name: Check matrix result
        env:
          RESULT: ${{ needs.package.result }}
        run: |
          echo "matrix result: ${RESULT}"
          [ "$RESULT" = "success" ] || exit 1
