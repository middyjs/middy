  FnDdbNewAndOld:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ddb-new-and-old
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
