AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  middy e2e event capture harness (tests/events/SPEC.md). One capture Lambda per
  event kind logs "MIDDY_CAPTURE <kind> <json>" to a shared log group. Raw
  CloudFormation, no transform, no build step (except triggers/docdb-writer).
  Deploy in us-east-1. Ephemeral: deploy -> trigger -> collect -> destroy.

Parameters:
  EnableVpc:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Tier 1 - VPC, ALB, VPC Lattice, in-VPC trigger proxy (ALB billed hourly)
  EnableBrokers:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Tier 2 - MSK, self-managed Kafka ESM, Amazon MQ x2, DocumentDB (hourly billed, MSK create 20-35 min; requires EnableVpc)
  EnableEdge:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Tier 3 - CloudFront + Lambda@Edge (stack delete stalls until replicas purge)
  EnableConfig:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: AWS Config recorder + custom rule (recorder is an account-level singleton)
  EnableCloudTrail:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Management-events trail + EventBridge CloudTrail rule
  EnableCodeCommit:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: CodeCommit repo + trigger (only works in accounts grandfathered into CodeCommit)
  EnableBedrock:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Bedrock agent + action groups (requires model access enabled in the account)
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Foundation model for the Bedrock agent (3.5+ Anthropic models require the cross-region inference profile id, us. prefix)
  EnableTransfer:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Transfer Family SFTP server with Lambda custom identity provider (server billed hourly)
  SesDomain:
    Type: String
    Default: ""
    Description: Tier 4 - domain you own (in the HostedZoneId zone) for SES receiving, e.g. events.example.com
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone id for SesDomain
  BrokerWriterCodeBucket:
    Type: String
    Default: ""
    Description: S3 bucket holding the packaged triggers/broker-writer zip (set by deploy.sh when EnableBrokers)
  BrokerWriterCodeKey:
    Type: String
    Default: ""
    Description: S3 key of the packaged broker-writer zip
  CaptureSerial:
    Type: String
    Default: "1"
    Description: Bump to fire the cfn.custom-resource Update event

Rules:
  BrokersNeedVpc:
    RuleCondition: !Equals [!Ref EnableBrokers, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableVpc, "true"]
        AssertDescription: EnableBrokers requires EnableVpc=true (brokers live in the tier-1 VPC)

Conditions:
  HasVpc: !Equals [!Ref EnableVpc, "true"]
  HasBrokers: !Equals [!Ref EnableBrokers, "true"]
  HasEdge: !Equals [!Ref EnableEdge, "true"]
  HasConfig: !Equals [!Ref EnableConfig, "true"]
  HasTrail: !Equals [!Ref EnableCloudTrail, "true"]
  HasCodeCommit: !Equals [!Ref EnableCodeCommit, "true"]
  HasBedrock: !Equals [!Ref EnableBedrock, "true"]
  HasTransfer: !Equals [!Ref EnableTransfer, "true"]
  HasSes: !And
    - !Not [!Equals [!Ref SesDomain, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Shared capture plumbing
  # ---------------------------------------------------------------------------
  # All non-edge capture functions log to this one group (LoggingConfig).
  # collect.mjs reads a single group instead of ~90.
  CaptureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AWS::StackName}/captures
      RetentionInDays: 1

  CaptureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: capture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CaptureLogGroup.Arn
              # Response contracts that require an API call back
              - Effect: Allow
                Action: s3:WriteGetObjectResponse
                Resource: "*"
              - Effect: Allow
                Action: states:SendTaskSuccess
                Resource: "*"
              - Effect: Allow
                Action: codepipeline:PutJobSuccessResult
                Resource: "*"
              # async destination delivery: the SOURCE function's execution
              # role invokes the destination function (lambda.dest-* kinds)
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
              # Poll-based event source mappings (SQS/DynamoDB/Kinesis) use the
              # function role to read the source
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-*
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*
              - Effect: Allow
                Action:
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamConsumer
                  - kinesis:DescribeStreamSummary
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:ListShards
                  - kinesis:ListStreams
                  - kinesis:SubscribeToShard
                Resource: "*"

  # ---------------------------------------------------------------------------
  # SQS - sqs.standard, sqs.fifo, sqs.sns, sqs.sns-raw, sqs.s3, lambda.dlq
  # ---------------------------------------------------------------------------
  SqsStandardQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-sqs-standard
  FnSqsStandard:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sqs-standard
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sqs.standard } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmSqsStandard:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SqsStandardQueue.Arn
      FunctionName: !Ref FnSqsStandard
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0

  SqsFifoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-sqs-fifo.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
  FnSqsFifo:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sqs-fifo
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sqs.fifo } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmSqsFifo:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SqsFifoQueue.Arn
      FunctionName: !Ref FnSqsFifo
      BatchSize: 10

  # SNS -> SQS (enveloped and raw) -> Lambda
  SqsSnsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-sqs-sns
  SqsSnsRawQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-sqs-sns-raw
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-topic
  SnsToSqsSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SnsTopic
      Protocol: sqs
      Endpoint: !GetAtt SqsSnsQueue.Arn
      RawMessageDelivery: false
  SnsToSqsRawSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SnsTopic
      Protocol: sqs
      Endpoint: !GetAtt SqsSnsRawQueue.Arn
      RawMessageDelivery: true
  SqsSnsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref SqsSnsQueue, !Ref SqsSnsRawQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: [!GetAtt SqsSnsQueue.Arn, !GetAtt SqsSnsRawQueue.Arn]
            Condition:
              ArnEquals: { aws:SourceArn: !Ref SnsTopic }
  FnSqsSns:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sqs-sns
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sqs.sns } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmSqsSns:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SqsSnsQueue.Arn
      FunctionName: !Ref FnSqsSns
  FnSqsSnsRaw:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sqs-sns-raw
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sqs.sns-raw } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmSqsSnsRaw:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SqsSnsRawQueue.Arn
      FunctionName: !Ref FnSqsSnsRaw

  # ---------------------------------------------------------------------------
  # SNS direct - sns.standard
  # ---------------------------------------------------------------------------
  FnSnsStandard:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sns-standard
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sns.standard } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  SnsToLambdaSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SnsTopic
      Protocol: lambda
      Endpoint: !GetAtt FnSnsStandard.Arn
  PermSnsStandard:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnSnsStandard
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref SnsTopic

  # ---------------------------------------------------------------------------
  # Lambda async destinations + DLQ - lambda.dest-success, lambda.dest-failure,
  # lambda.dlq
  # ---------------------------------------------------------------------------
  FnDestSuccess:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lambda-dest-success
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: lambda.dest-success } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  FnDestFailure:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lambda-dest-failure
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: lambda.dest-failure } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  HelperSucceeds:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-helper-succeeds
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Code:
        ZipFile: |
          exports.handler = async (e) => ({ ok: true, echo: e });
  HelperSucceedsInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref HelperSucceeds
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      DestinationConfig:
        OnSuccess: { Destination: !GetAtt FnDestSuccess.Arn }
  HelperThrows:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-helper-throws
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Code:
        ZipFile: |
          exports.handler = async () => { throw new Error("middy-events intentional failure"); };
  HelperThrowsInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref HelperThrows
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      DestinationConfig:
        OnFailure: { Destination: !GetAtt FnDestFailure.Arn }
  DlqQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-lambda-dlq
  HelperThrowsDlq:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-helper-throws-dlq
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt DlqHelperRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      DeadLetterConfig: { TargetArn: !GetAtt DlqQueue.Arn }
      Code:
        ZipFile: |
          exports.handler = async () => { throw new Error("middy-events intentional failure"); };
  HelperThrowsDlqInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref HelperThrowsDlq
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
  DlqHelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dlq
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CaptureLogGroup.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DlqQueue.Arn
  FnLambdaDlq:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lambda-dlq
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: lambda.dlq } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmLambdaDlq:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DlqQueue.Arn
      FunctionName: !Ref FnLambdaDlq

  # ---------------------------------------------------------------------------
  # S3 - s3.put, s3.delete, s3.delete-marker, s3.sns, s3.sqs, s3.eventbridge,
  # s3batch.v1, s3object.get
  # Bucket names are deterministic strings (not !Ref) so Lambda permissions and
  # topic/queue policies can reference them without circular dependencies.
  # ---------------------------------------------------------------------------
  FnS3Put:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-put
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.put } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  FnS3Delete:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-delete
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.delete } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  FnS3DeleteMarker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-delete-marker
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.delete-marker } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermS3Put:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnS3Put
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${AWS::StackName}-main-${AWS::AccountId}
  PermS3Delete:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnS3Delete
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${AWS::StackName}-main-${AWS::AccountId}
  PermS3DeleteMarker:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnS3DeleteMarker
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${AWS::StackName}-versioned-${AWS::AccountId}

  S3EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-s3-events
  S3EventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref S3EventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref S3EventsTopic
            Condition:
              ArnEquals: { aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-main-${AWS::AccountId}" }
  FnS3Sns:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-sns
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.sns } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  S3SnsToLambdaSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref S3EventsTopic
      Protocol: lambda
      Endpoint: !GetAtt FnS3Sns.Arn
  PermS3Sns:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnS3Sns
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref S3EventsTopic

  # S3 -> SNS -> SQS -> Lambda: the full three-level fan-out walk that
  # @middy/event-normalizer documents (S3 records inside an SNS Notification
  # envelope inside an SQS body). Fired by the same sns/-prefix PutObject.
  S3SnsSqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-s3-sns-sqs
  S3SnsSqsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref S3SnsSqsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt S3SnsSqsQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Ref S3EventsTopic }
  S3SnsToSqsSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref S3EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt S3SnsSqsQueue.Arn
      RawMessageDelivery: false
  FnS3SnsSqs:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-sns-sqs
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.sns-sqs } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmS3SnsSqs:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt S3SnsSqsQueue.Arn
      FunctionName: !Ref FnS3SnsSqs

  S3SqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-s3-sqs
  S3SqsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref S3SqsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt S3SqsQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-main-${AWS::AccountId}" }
  FnS3Sqs:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-sqs
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.sqs } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmS3Sqs:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt S3SqsQueue.Arn
      FunctionName: !Ref FnS3Sqs

  MainBucket:
    Type: AWS::S3::Bucket
    DependsOn: [PermS3Put, PermS3Delete, S3EventsTopicPolicy, S3SqsQueuePolicy]
    Properties:
      BucketName: !Sub ${AWS::StackName}-main-${AWS::AccountId}
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FnS3Put.Arn
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: put/ }] } }
          - Event: s3:ObjectRemoved:*
            Function: !GetAtt FnS3Delete.Arn
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: delete/ }] } }
        TopicConfigurations:
          - Event: s3:ObjectCreated:*
            Topic: !Ref S3EventsTopic
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: sns/ }] } }
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt S3SqsQueue.Arn
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: sqs/ }] } }
  VersionedBucket:
    Type: AWS::S3::Bucket
    DependsOn: [PermS3DeleteMarker]
    Properties:
      BucketName: !Sub ${AWS::StackName}-versioned-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectRemoved:DeleteMarkerCreated
            Function: !GetAtt FnS3DeleteMarker.Arn
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: dm/ }] } }

  FnS3Eventbridge:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3-eventbridge
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3.eventbridge } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  S3EventbridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-s3-eventbridge
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: { name: [!Sub "${AWS::StackName}-main-${AWS::AccountId}"] }
          object: { key: [{ prefix: eb/ }] }
      Targets:
        - Id: capture
          Arn: !GetAtt FnS3Eventbridge.Arn
  PermS3Eventbridge:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnS3Eventbridge
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3EventbridgeRule.Arn

  # S3 Batch Operations (job created by trigger.mjs; this is the job role + fn)
  FnS3Batch:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3batch-v1
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3batch.v1 } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              invocationSchemaVersion: e.invocationSchemaVersion || "1.0",
              treatMissingKeysAs: "PermanentFailure",
              invocationId: e.invocationId,
              results: (e.tasks || []).map((t) => ({ taskId: t.taskId, resultCode: "Succeeded", resultString: "captured" }))
            };
          };
  S3BatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-s3batch
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: batchoperations.s3.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: batch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${AWS::StackName}-main-${AWS::AccountId}/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FnS3Batch.Arn

  # S3 Object Lambda
  FnS3Object:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-s3object-get
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: s3object.get } }
      Code:
        ZipFile: |
          const { S3 } = require("@aws-sdk/client-s3");
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            const c = e.getObjectContext;
            await new S3({}).writeGetObjectResponse({ RequestRoute: c.outputRoute, RequestToken: c.outputToken, Body: "middy-capture" });
            return { statusCode: 200 };
          };
  SupportingAccessPoint:
    Type: AWS::S3::AccessPoint
    Properties:
      Bucket: !Ref MainBucket
      Name: !Sub ${AWS::StackName}-supporting
  ObjectLambdaAccessPoint:
    Type: AWS::S3ObjectLambda::AccessPoint
    Properties:
      Name: !Sub ${AWS::StackName}-olap
      ObjectLambdaConfiguration:
        SupportingAccessPoint: !GetAtt SupportingAccessPoint.Arn
        TransformationConfigurations:
          - Actions: [GetObject]
            ContentTransformation:
              AwsLambda: { FunctionArn: !GetAtt FnS3Object.Arn }

  # ---------------------------------------------------------------------------
  # DynamoDB Streams - ddb.keys-only, ddb.new-image, ddb.old-image,
  # ddb.new-and-old, ddb.windowed (view type is immutable per stream: one table
  # per view type, on-demand billing, free while idle)
  # ---------------------------------------------------------------------------
  DdbKeysOnlyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-keys-only
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      StreamSpecification: { StreamViewType: KEYS_ONLY }
  FnDdbKeysOnly:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ddb-keys-only
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: ddb.keys-only } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmDdbKeysOnly:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DdbKeysOnlyTable.StreamArn
      FunctionName: !Ref FnDdbKeysOnly
      StartingPosition: LATEST
      BatchSize: 10
      # batch INSERT+MODIFY+REMOVE into one invocation so a single fixture
      # shows all three eventName shapes
      MaximumBatchingWindowInSeconds: 5

