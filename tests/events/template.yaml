  # ---------------------------------------------------------------------------
  # Kinesis - kinesis.standard, kinesis.efo, kinesis.windowed
  # ---------------------------------------------------------------------------
  KinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub ${AWS::StackName}-stream
      ShardCount: 1
      RetentionPeriodHours: 24
  FnKinesisStandard:
