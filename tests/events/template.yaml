      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: appsync.resolver } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return JSON.stringify({ ok: true }); };
  AppsyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub ${AWS::StackName}-appsync
      AuthenticationType: API_KEY
  AppsyncApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt AppsyncApi.ApiId
  AppsyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppsyncApi.ApiId
