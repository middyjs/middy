  FnCognitoCustomMessage:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cognito-custom-message
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cognito.custom-message } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return e; };
  FnCognitoDefineAuth:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cognito-define-auth
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cognito.define-auth } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            const s = e.request.session || [];
            if (s.length && s[s.length - 1].challengeResult === true) {
              e.response.issueTokens = true;
              e.response.failAuthentication = false;
            } else {
              e.response.issueTokens = false;
              e.response.failAuthentication = false;
              e.response.challengeName = "CUSTOM_CHALLENGE";
            }
            return e;
          };
  FnCognitoCreateAuth:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cognito-create-auth
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cognito.create-auth } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            e.response.publicChallengeParameters = { question: "answer 42" };
            e.response.privateChallengeParameters = { answer: "42" };
            e.response.challengeMetadata = "CAPTURE";
            return e;
          };
  FnCognitoVerifyAuth:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cognito-verify-auth
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cognito.verify-auth } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            e.response.answerCorrect = e.request.challengeAnswer === "42";
            return e;
          };
  FnCognitoUserMigration:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cognito-user-migration
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cognito.user-migration } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            e.response.userAttributes = { email: e.userName, email_verified: "true" };
            e.response.finalUserStatus = "CONFIRMED";
            e.response.messageAction = "SUPPRESS";
            return e;
          };
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: false, RequireUppercase: false, RequireNumbers: false, RequireSymbols: false }
      LambdaConfig:
        PreSignUp: !GetAtt FnCognitoPreSignup.Arn
        PostConfirmation: !GetAtt FnCognitoPostConfirmation.Arn
        PreAuthentication: !GetAtt FnCognitoPreAuth.Arn
        PostAuthentication: !GetAtt FnCognitoPostAuth.Arn
        PreTokenGeneration: !GetAtt FnCognitoPreToken.Arn
        CustomMessage: !GetAtt FnCognitoCustomMessage.Arn
        DefineAuthChallenge: !GetAtt FnCognitoDefineAuth.Arn
        CreateAuthChallenge: !GetAtt FnCognitoCreateAuth.Arn
        VerifyAuthChallengeResponse: !GetAtt FnCognitoVerifyAuth.Arn
        UserMigration: !GetAtt FnCognitoUserMigration.Arn
  UserPoolClient:
