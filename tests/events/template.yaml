  # CloudTrail -> EventBridge (gated: creates a management-events trail)
  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: HasTrail
    Properties:
      BucketName: !Sub ${AWS::StackName}-trail-${AWS::AccountId}
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasTrail
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals: { s3:x-amz-acl: bucket-owner-full-control }
  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: HasTrail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub ${AWS::StackName}-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
  FnEbCloudtrail:
    Type: AWS::Lambda::Function
    Condition: HasTrail
    Properties:
      FunctionName: !Sub ${AWS::StackName}-eventbridge-cloudtrail
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: eventbridge.cloudtrail } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EbCloudtrailRule:
    Type: AWS::Events::Rule
    Condition: HasTrail
    Properties:
      Name: !Sub ${AWS::StackName}-cloudtrail
      EventPattern:
        source: [aws.s3]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [s3.amazonaws.com]
          eventName: [PutBucketTagging]
      Targets: [{ Id: capture, Arn: !GetAtt FnEbCloudtrail.Arn }]
  PermEbCloudtrail:
    Type: AWS::Lambda::Permission
    Condition: HasTrail
    Properties:
      FunctionName: !Ref FnEbCloudtrail
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EbCloudtrailRule.Arn

  # EventBridge Scheduler (Input delivered verbatim; context placeholders in it)
  FnEbScheduler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-eventbridge-scheduler
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: eventbridge.scheduler } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FnEbScheduler.Arn
  SchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-scheduler
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt FnEbScheduler.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"scheduleArn":"<aws.scheduler.schedule-arn>","scheduledTime":"<aws.scheduler.scheduled-time>","executionId":"<aws.scheduler.execution-id>","attemptNumber":"<aws.scheduler.attempt-number>"}'

  # EventBridge Pipes (SQS source -> Lambda target)
  PipeSourceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-pipe-source
  FnEbPipe:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-eventbridge-pipe
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: eventbridge.pipe-sqs } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: pipes.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt PipeSourceQueue.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FnEbPipe.Arn
  Pipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub ${AWS::StackName}-pipe
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt PipeSourceQueue.Arn
      Target: !GetAtt FnEbPipe.Arn

  # ---------------------------------------------------------------------------
  # IoT Core rule - iot.rule
  # ---------------------------------------------------------------------------
  FnIot:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-iot-rule
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: iot.rule } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  IotRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - "${Name}_capture"
        - { Name: !Join ["_", !Split ["-", !Ref AWS::StackName]] }
      TopicRulePayload:
        Sql: SELECT * FROM 'middy/capture'
        AwsIotSqlVersion: "2016-03-23"
        Actions:
          - Lambda: { FunctionArn: !GetAtt FnIot.Arn }
  PermIot:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnIot
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IotRule.Arn

  # IoT custom authorizer - iot.custom-authorizer
  # Trigger: TestInvokeAuthorizer (no MQTT client needed); SigningDisabled so
  # no token signature dance.
  FnIotAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-iot-custom-authorizer
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: iot.custom-authorizer } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              isAuthenticated: true,
              principalId: "middy",
              disconnectAfterInSeconds: 300,
              refreshAfterInSeconds: 300,
              policyDocuments: [
                { Version: "2012-10-17", Statement: [{ Action: "iot:*", Effect: "Allow", Resource: "*" }] }
              ]
            };
          };
  IotAuthorizer:
    Type: AWS::IoT::Authorizer
    Properties:
      AuthorizerName: !Sub ${AWS::StackName}-authorizer
      AuthorizerFunctionArn: !GetAtt FnIotAuthorizer.Arn
      SigningDisabled: true
      Status: ACTIVE
  PermIotAuthorizer:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnIotAuthorizer
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IotAuthorizer.Arn

  # ---------------------------------------------------------------------------
  # Secrets Manager rotation - secrets.rotation
  # Capture responds to no rotation steps: the rotation stays IN_PROGRESS by
  # design; destroy.sh force-deletes the secret.
  # ---------------------------------------------------------------------------
  FnSecrets:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-secrets-rotation
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: secrets.rotation } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermSecrets:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnSecrets
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  RotationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/rotation
      GenerateSecretString:
        SecretStringTemplate: '{"username": "middy"}'
        GenerateStringKey: password
  RotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: PermSecrets
    Properties:
      SecretId: !Ref RotationSecret
      RotationLambdaARN: !GetAtt FnSecrets.Arn
      RotateImmediatelyOnUpdate: false
      RotationRules: { AutomaticallyAfterDays: 1 }

  # ---------------------------------------------------------------------------
  # Step Functions - sfn.task, sfn.task-token
  # ---------------------------------------------------------------------------
  FnSfnTask:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sfn-task
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sfn.task } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return { ok: true }; };
  FnSfnToken:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sfn-task-token
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: sfn.task-token } }
      Code:
        ZipFile: |
          const { SFN } = require("@aws-sdk/client-sfn");
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            await new SFN({}).sendTaskSuccess({ taskToken: e.token, output: JSON.stringify({ ok: true }) });
            return {};
          };
  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: [!GetAtt FnSfnTask.Arn, !GetAtt FnSfnToken.Arn]
  SfnTaskMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-task
      RoleArn: !GetAtt SfnRole.Arn
      Definition:
        StartAt: Capture
        States:
          Capture:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !Ref FnSfnTask
              Payload:
                input.$: $
                execution.$: $$.Execution
                state.$: $$.State
                stateMachine.$: $$.StateMachine
            End: true
  SfnTokenMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-task-token
      RoleArn: !GetAtt SfnRole.Arn
      Definition:
        StartAt: CaptureToken
        States:
          CaptureToken:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            TimeoutSeconds: 120
            Parameters:
              FunctionName: !Ref FnSfnToken
              Payload:
                token.$: $$.Task.Token
                input.$: $
                execution.$: $$.Execution
            End: true

  # ---------------------------------------------------------------------------
  # CloudFormation custom resource - cfn.custom-resource (self-triggering:
  # Create on deploy, Update on CaptureSerial change, Delete on teardown)
  # ---------------------------------------------------------------------------
  FnCfn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cfn-custom-resource
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cfn.custom-resource } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            const body = JSON.stringify({
              Status: "SUCCESS",
              PhysicalResourceId: "middy-capture",
              StackId: e.StackId,
              RequestId: e.RequestId,
              LogicalResourceId: e.LogicalResourceId,
              Data: {}
            });
            await fetch(e.ResponseURL, { method: "PUT", headers: { "content-type": "" }, body });
            return {};
          };
  CustomCapture:
    Type: Custom::MiddyCapture
    Properties:
      ServiceToken: !GetAtt FnCfn.Arn
      Serial: !Ref CaptureSerial
      Sample: { nested: { key: value }, list: [1, 2, 3] }

  # CloudFormation macro - cfn.macro
  # Trigger: trigger.mjs deploys/deletes a probe stack whose template declares
  # Transform: <stackname-without-dashes>macro (macro names are alphanumeric).
  # The stack creator needs lambda:InvokeFunction on this function (no
  # resource-based policy involved).
  FnCfnMacro:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cfn-macro
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cfn.macro } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { requestId: e.requestId, status: "success", fragment: e.fragment };
          };
  CfnMacro:
    Type: AWS::CloudFormation::Macro
    Properties:
      Name: !Join ["", !Split ["-", !Sub "${AWS::StackName}-macro"]]
      FunctionName: !GetAtt FnCfnMacro.Arn

  # ---------------------------------------------------------------------------
  # CodePipeline invoke action - codepipeline.job
  # V2 pipeline, S3 source (versioned bucket, pipeline/source.zip)
  # ---------------------------------------------------------------------------
  FnCodepipeline:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-codepipeline-job
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: codepipeline.job } }
      Code:
        ZipFile: |
          const { CodePipeline } = require("@aws-sdk/client-codepipeline");
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            await new CodePipeline({}).putJobSuccessResult({ jobId: e["CodePipeline.job"].id });
            return {};
          };
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:GetBucketVersioning, s3:PutObject]
                Resource:
                  - !GetAtt VersionedBucket.Arn
                  - !Sub ${VersionedBucket.Arn}/*
                  - !GetAtt MainBucket.Arn
                  - !Sub ${MainBucket.Arn}/*
              - Effect: Allow
                Action: [lambda:InvokeFunction, lambda:ListFunctions]
                Resource: "*"
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${AWS::StackName}-pipeline
      PipelineType: V2
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref MainBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: { Category: Source, Owner: AWS, Provider: S3, Version: "1" }
              Configuration:
                S3Bucket: !Ref VersionedBucket
                S3ObjectKey: pipeline/source.zip
                PollForSourceChanges: false
              OutputArtifacts: [{ Name: src }]
        - Name: Invoke
          Actions:
            - Name: Capture
              ActionTypeId: { Category: Invoke, Owner: AWS, Provider: Lambda, Version: "1" }
              Configuration:
                FunctionName: !Ref FnCodepipeline
                UserParameters: '{"from":"middy-events","nested":{"key":"value"}}'
              InputArtifacts: [{ Name: src }]

  # ---------------------------------------------------------------------------
  # CodeCommit trigger - codecommit.push (gated: service closed to new accounts)
  # ---------------------------------------------------------------------------
  FnCodecommit:
    Type: AWS::Lambda::Function
    Condition: HasCodeCommit
    Properties:
      FunctionName: !Sub ${AWS::StackName}-codecommit-push
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: codecommit.push } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermCodecommit:
    Type: AWS::Lambda::Permission
    Condition: HasCodeCommit
    Properties:
      FunctionName: !Ref FnCodecommit
      Action: lambda:InvokeFunction
      Principal: codecommit.amazonaws.com
      SourceArn: !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-repo
  CodeCommitRepo:
    Type: AWS::CodeCommit::Repository
    Condition: HasCodeCommit
    DependsOn: PermCodecommit
    Properties:
      RepositoryName: !Sub ${AWS::StackName}-repo
      Triggers:
        - Name: capture
          DestinationArn: !GetAtt FnCodecommit.Arn
          Events: [updateReference]

  # ---------------------------------------------------------------------------
  # AWS Config custom rule - config.rule (gated: recorder is an account
  # singleton; do not enable in accounts that already run AWS Config)
  # ---------------------------------------------------------------------------
  FnConfig:
    Type: AWS::Lambda::Function
    Condition: HasConfig
    Properties:
      FunctionName: !Sub ${AWS::StackName}-config-rule
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: config.rule } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermConfig:
    Type: AWS::Lambda::Permission
    Condition: HasConfig
    Properties:
      FunctionName: !Ref FnConfig
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  ConfigRole:
    Type: AWS::IAM::Role
    Condition: HasConfig
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWS_ConfigRole]
      Policies:
        - PolicyName: delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MainBucket.Arn}/config/*
                Condition:
                  StringEquals: { s3:x-amz-acl: bucket-owner-full-control }
              - Effect: Allow
                Action: s3:GetBucketAcl
                Resource: !GetAtt MainBucket.Arn
  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Condition: HasConfig
    Properties:
      Name: !Sub ${AWS::StackName}-recorder
      RoleARN: !GetAtt ConfigRole.Arn
      RecordingGroup:
        AllSupported: false
        IncludeGlobalResourceTypes: false
        ResourceTypes: [AWS::SQS::Queue]
  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Condition: HasConfig
    # a delivery channel cannot be created before a recorder exists
    DependsOn: ConfigRecorder
    Properties:
      Name: !Sub ${AWS::StackName}-delivery
      S3BucketName: !Ref MainBucket
      S3KeyPrefix: config
  ConfigRule:
    Type: AWS::Config::ConfigRule
    Condition: HasConfig
    DependsOn: [ConfigRecorder, PermConfig]
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-rule
      Scope: { ComplianceResourceTypes: [AWS::SQS::Queue] }
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier: !GetAtt FnConfig.Arn
        SourceDetails:
          - EventSource: aws.config
            MessageType: ConfigurationItemChangeNotification

  # ---------------------------------------------------------------------------
  # AWS Transfer Family custom identity provider - transfer.custom-idp
  # (gated EnableTransfer: server billed hourly). Trigger: TestIdentityProvider,
  # no SFTP client required.
  # ---------------------------------------------------------------------------
  TransferUserRole:
    Type: AWS::IAM::Role
    Condition: HasTransfer
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: transfer.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject]
                Resource:
                  - !GetAtt MainBucket.Arn
                  - !Sub ${MainBucket.Arn}/transfer/*
  FnTransferIdp:
    Type: AWS::Lambda::Function
    Condition: HasTransfer
    Properties:
      FunctionName: !Sub ${AWS::StackName}-transfer-custom-idp
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment:
        Variables:
          KIND: transfer.custom-idp
          TRANSFER_ROLE_ARN: !GetAtt TransferUserRole.Arn
          HOME_BUCKET: !Ref MainBucket
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { Role: process.env.TRANSFER_ROLE_ARN, HomeDirectory: "/" + process.env.HOME_BUCKET + "/transfer" };
          };
  PermTransfer:
    Type: AWS::Lambda::Permission
    Condition: HasTransfer
    Properties:
      FunctionName: !Ref FnTransferIdp
      Action: lambda:InvokeFunction
      Principal: transfer.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  TransferServer:
    Type: AWS::Transfer::Server
    Condition: HasTransfer
    DependsOn: PermTransfer
    Properties:
      Domain: S3
      EndpointType: PUBLIC
      Protocols: [SFTP]
      IdentityProviderType: AWS_LAMBDA
      IdentityProviderDetails:
        Function: !GetAtt FnTransferIdp.Arn

  # ---------------------------------------------------------------------------
  # API Gateway REST (payload v1) - apigw.rest.proxy, apigw.rest.binary,
  # apigw.rest.authorized, apigw.rest.cognito, apigw.rest.iam,
  # apigw.authorizer.rest-token, apigw.authorizer.rest-request
  # ---------------------------------------------------------------------------
  FnApigwRestProxy:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-apigw-rest-proxy
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: apigw.rest.proxy } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ ok: true }) };
          };
  FnApigwRestAuthorized:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-apigw-rest-authorized
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: apigw.rest.authorized } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ ok: true }) };
          };
  FnAuthRestToken:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-auth-rest-token
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: apigw.authorizer.rest-token } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              principalId: "middy",
              policyDocument: { Version: "2012-10-17", Statement: [{ Action: "execute-api:Invoke", Effect: "Allow", Resource: e.methodArn }] },
              context: { from: "token-authorizer", n: 1, b: true }
            };
          };
  FnAuthRestRequest:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-auth-rest-request
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: apigw.authorizer.rest-request } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              principalId: "middy",
              policyDocument: { Version: "2012-10-17", Statement: [{ Action: "execute-api:Invoke", Effect: "Allow", Resource: e.methodArn }] },
              context: { from: "request-authorizer" }
            };
          };
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-rest
      EndpointConfiguration: { Types: [REGIONAL] }
  RestEchoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: echo
  RestEchoProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref RestEchoResource
      PathPart: "{proxy+}"
  RestEchoMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RestEchoProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters: { method.request.path.proxy: true }
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnApigwRestProxy.Arn}/invocations
  RestTokenAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref RestApi
      Name: token-auth
      Type: TOKEN
