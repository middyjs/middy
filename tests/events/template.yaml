      FieldName: capture
      DataSourceName: !GetAtt AppsyncDataSource.Name

  # ---------------------------------------------------------------------------
  # Lex V2 code hooks - lex.dialog + lex.fulfillment (one alias code hook
  # Lambda serves both; the kind is derived from invocationSource)
  # ---------------------------------------------------------------------------
  FnLex:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lex-hook
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            const kind = e.invocationSource === "DialogCodeHook" ? "lex.dialog" : "lex.fulfillment";
            console.log("MIDDY_CAPTURE " + kind + " " + JSON.stringify(e));
            if (e.invocationSource === "DialogCodeHook") {
              return { sessionState: { dialogAction: { type: "Delegate" }, intent: e.sessionState.intent } };
            }
            const intent = Object.assign({}, e.sessionState.intent, { state: "Fulfilled" });
            return {
              sessionState: { dialogAction: { type: "Close" }, intent },
              messages: [{ contentType: "PlainText", content: "captured" }]
            };
          };
  PermLex:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnLex
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !Sub arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${LexBot}/TSTALIASID
  LexRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lexv2.amazonaws.com }
            Action: sts:AssumeRole
  LexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: !Sub ${AWS::StackName}-bot
      RoleArn: !GetAtt LexRole.Arn
      DataPrivacy: { ChildDirected: false }
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.4
          Intents:
            - Name: CaptureIntent
              SampleUtterances:
                - { Utterance: capture }
                - { Utterance: capture the event }
              DialogCodeHook: { Enabled: true }
              FulfillmentCodeHook: { Enabled: true }
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
      TestBotAliasSettings:
        BotAliasLocaleSettings:
          - LocaleId: en_US
            BotAliasLocaleSetting:
              Enabled: true
              CodeHookSpecification:
                LambdaCodeHook:
                  CodeHookInterfaceVersion: "1.0"
                  LambdaArn: !GetAtt FnLex.Arn

  # ---------------------------------------------------------------------------
  # Bedrock agent action groups - bedrock.agent-api, bedrock.agent-function
  # (gated: requires model access)
  # ---------------------------------------------------------------------------
  FnBedrockApi:
    Type: AWS::Lambda::Function
    Condition: HasBedrock
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bedrock-agent-api
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: bedrock.agent-api } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              messageVersion: "1.0",
              response: {
                actionGroup: e.actionGroup,
                apiPath: e.apiPath,
                httpMethod: e.httpMethod,
                httpStatusCode: 200,
                responseBody: { "application/json": { body: "{\"ok\":true}" } }
              }
            };
          };
  FnBedrockFn:
    Type: AWS::Lambda::Function
    Condition: HasBedrock
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bedrock-agent-function
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: bedrock.agent-function } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return {
              messageVersion: "1.0",
              response: {
                actionGroup: e.actionGroup,
                function: e.function,
                functionResponse: { responseBody: { TEXT: { body: "ok" } } }
              }
            };
          };
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Condition: HasBedrock
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # inference profiles fan out to sibling-region foundation models
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Condition: HasBedrock
    Properties:
      AgentName: !Sub ${AWS::StackName}-agent
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      FoundationModel: !Ref BedrockModelId
      AutoPrepare: true
      Instruction: >-
        You are a test harness agent. When the user asks you to capture events,
        call the captureApi operation and the captureFunction function.
      ActionGroups:
        - ActionGroupName: api-group
          ActionGroupExecutor: { Lambda: !GetAtt FnBedrockApi.Arn }
          ApiSchema:
            Payload: '{"openapi":"3.0.0","info":{"title":"capture","version":"1.0.0"},"paths":{"/capture":{"post":{"operationId":"captureApi","description":"Capture a test event","responses":{"200":{"description":"ok"}}}}}}'
        - ActionGroupName: fn-group
          ActionGroupExecutor: { Lambda: !GetAtt FnBedrockFn.Arn }
          FunctionSchema:
            Functions:
              - Name: captureFunction
                Description: Capture a test event via function schema
                Parameters:
                  note: { Type: string, Required: false, Description: optional note }
  BedrockAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Condition: HasBedrock
    Properties:
      AgentAliasName: live
      AgentId: !GetAtt BedrockAgent.AgentId
  PermBedrockApi:
    Type: AWS::Lambda::Permission
    Condition: HasBedrock
    Properties:
      FunctionName: !Ref FnBedrockApi
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !GetAtt BedrockAgent.AgentArn
  PermBedrockFn:
    Type: AWS::Lambda::Permission
    Condition: HasBedrock
    Properties:
      FunctionName: !Ref FnBedrockFn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !GetAtt BedrockAgent.AgentArn

  # ---------------------------------------------------------------------------
  # Tier 1 (EnableVpc) - VPC, ALB (alb.single, alb.multi), VPC Lattice
  # (lattice.v1, lattice.v2), in-VPC trigger proxy
  # Public subnets + IGW only; no NAT. The proxy Lambda only reaches in-VPC
  # targets (Lattice link-local, broker private IPs).
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: HasVpc
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]
  SubnetA:
    Type: AWS::EC2::Subnet
    Condition: HasVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Condition: HasVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  Igw:
    Type: AWS::EC2::InternetGateway
    Condition: HasVpc
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasVpc
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: HasVpc
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: HasVpc
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasVpc
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasVpc
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }
  VpcDefaultSg:
    Type: AWS::EC2::SecurityGroup
    Condition: HasVpc
    Properties:
      GroupDescription: middy-events shared (proxy + brokers)
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{ IpProtocol: "-1", CidrIp: 0.0.0.0/0 }]
  VpcSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasVpc
    Properties:
      GroupId: !Ref VpcDefaultSg
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref VpcDefaultSg

  ProxyRole:
    Type: AWS::IAM::Role
    Condition: HasVpc
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole]
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/*
  # Relays HTTP requests from trigger.mjs into the VPC:
  # invoke with {url, method, headers, body} -> {status, body}
  FnProxy:
    Type: AWS::Lambda::Function
    Condition: HasVpc
    Properties:
      FunctionName: !Sub ${AWS::StackName}-proxy
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ProxyRole.Arn
      Timeout: 60
      VpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroupIds: [!Ref VpcDefaultSg]
      Code:
        ZipFile: |
          const tls = require("node:tls");
          tls.DEFAULT_MIN_VERSION = "TLSv1.2";
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"; // broker consoles use self-signed/AWS-internal certs
          exports.handler = async (e) => {
            const r = await fetch(e.url, { method: e.method || "GET", headers: e.headers || {}, body: e.body });
            return { status: r.status, body: await r.text() };
          };

  # ALB -> Lambda
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Condition: HasVpc
    Properties:
      GroupDescription: middy-events alb
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{ IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }]
      SecurityGroupEgress: [{ IpProtocol: "-1", CidrIp: 0.0.0.0/0 }]
  FnAlbSingle:
    Type: AWS::Lambda::Function
    Condition: HasVpc
    Properties:
      FunctionName: !Sub ${AWS::StackName}-alb-single
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: alb.single } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ ok: true }) };
          };
  FnAlbMulti:
    Type: AWS::Lambda::Function
    Condition: HasVpc
    Properties:
      FunctionName: !Sub ${AWS::StackName}-alb-multi
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: alb.multi } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { statusCode: 200, multiValueHeaders: { "content-type": ["application/json"] }, body: JSON.stringify({ ok: true }) };
          };
  PermAlbSingle:
    Type: AWS::Lambda::Permission
    Condition: HasVpc
    Properties:
      FunctionName: !Ref FnAlbSingle
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
  PermAlbMulti:
    Type: AWS::Lambda::Permission
    Condition: HasVpc
    Properties:
      FunctionName: !Ref FnAlbMulti
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: HasVpc
    Properties:
      Name: !Sub ${AWS::StackName}-alb
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSg]
  AlbTgSingle:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasVpc
    DependsOn: PermAlbSingle
    Properties:
      Name: !Sub ${AWS::StackName}-single
      TargetType: lambda
      Targets: [{ Id: !GetAtt FnAlbSingle.Arn }]
  AlbTgMulti:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasVpc
    DependsOn: PermAlbMulti
    Properties:
      Name: !Sub ${AWS::StackName}-multi
      TargetType: lambda
      TargetGroupAttributes: [{ Key: lambda.multi_value_headers.enabled, Value: "true" }]
      Targets: [{ Id: !GetAtt FnAlbMulti.Arn }]
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasVpc
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref AlbTgSingle }]
  AlbMultiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasVpc
    Properties:
      ListenerArn: !Ref AlbListener
      Priority: 10
      Conditions: [{ Field: path-pattern, Values: [/multi*] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref AlbTgMulti }]

  # VPC Lattice -> Lambda (event structure V1 and V2 target groups)
  FnLatticeV1:
    Type: AWS::Lambda::Function
    Condition: HasVpc
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lattice-v1
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: lattice.v1 } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { isBase64Encoded: false, statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ ok: true }) };
          };
  FnLatticeV2:
    Type: AWS::Lambda::Function
    Condition: HasVpc
    Properties:
      FunctionName: !Sub ${AWS::StackName}-lattice-v2
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: lattice.v2 } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { isBase64Encoded: false, statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ ok: true }) };
          };
  PermLatticeV1:
    Type: AWS::Lambda::Permission
    Condition: HasVpc
    Properties:
      FunctionName: !Ref FnLatticeV1
      Action: lambda:InvokeFunction
      Principal: vpc-lattice.amazonaws.com
  PermLatticeV2:
    Type: AWS::Lambda::Permission
    Condition: HasVpc
    Properties:
      FunctionName: !Ref FnLatticeV2
      Action: lambda:InvokeFunction
      Principal: vpc-lattice.amazonaws.com
  LatticeNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Condition: HasVpc
    Properties:
      Name: !Sub ${AWS::StackName}-network
      AuthType: NONE
  LatticeVpcAssoc:
    Type: AWS::VpcLattice::ServiceNetworkVpcAssociation
    Condition: HasVpc
    Properties:
      ServiceNetworkIdentifier: !Ref LatticeNetwork
      VpcIdentifier: !Ref Vpc
      SecurityGroupIds: [!Ref VpcDefaultSg]
  LatticeService:
    Type: AWS::VpcLattice::Service
    Condition: HasVpc
    Properties:
      Name: !Sub ${AWS::StackName}-service
      AuthType: NONE
  LatticeServiceAssoc:
    Type: AWS::VpcLattice::ServiceNetworkServiceAssociation
    Condition: HasVpc
    Properties:
      ServiceNetworkIdentifier: !Ref LatticeNetwork
      ServiceIdentifier: !Ref LatticeService
  LatticeTgV1:
    Type: AWS::VpcLattice::TargetGroup
    Condition: HasVpc
    DependsOn: PermLatticeV1
    Properties:
      Name: !Sub ${AWS::StackName}-v1
      Type: LAMBDA
      Config: { LambdaEventStructureVersion: V1 }
      Targets: [{ Id: !GetAtt FnLatticeV1.Arn }]
  LatticeTgV2:
    Type: AWS::VpcLattice::TargetGroup
    Condition: HasVpc
    DependsOn: PermLatticeV2
    Properties:
      Name: !Sub ${AWS::StackName}-v2
      Type: LAMBDA
      Config: { LambdaEventStructureVersion: V2 }
      Targets: [{ Id: !GetAtt FnLatticeV2.Arn }]
  LatticeListener:
    Type: AWS::VpcLattice::Listener
    Condition: HasVpc
    Properties:
      ServiceIdentifier: !Ref LatticeService
      Protocol: HTTPS
      Port: 443
      DefaultAction:
        Forward: { TargetGroups: [{ TargetGroupIdentifier: !Ref LatticeTgV1 }] }
  LatticeV2Rule:
    Type: AWS::VpcLattice::Rule
    Condition: HasVpc
    Properties:
      ServiceIdentifier: !Ref LatticeService
      ListenerIdentifier: !Ref LatticeListener
      Name: v2
      Priority: 10
      Match:
        HttpMatch:
          PathMatch: { Match: { Prefix: /v2 } }
      Action:
        Forward: { TargetGroups: [{ TargetGroupIdentifier: !Ref LatticeTgV2 }] }

  # ---------------------------------------------------------------------------
  # Tier 2 (EnableBrokers, requires EnableVpc) - msk.standard,
  # kafka.self-managed, mq.activemq, mq.rabbitmq, docdb.insert
  # Broker admin passwords are deterministic non-secrets for this ephemeral
  # harness; the SCRAM/DocumentDB secrets are generated.
  # ---------------------------------------------------------------------------
  BrokerAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: HasBrokers
    Properties:
      PolicyName: broker-access
      Roles: [!Ref CaptureRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ESM networking (MSK / MQ / DocumentDB pollers run in the VPC)
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: "*"
          - Effect: Allow
            Action: [kafka:DescribeCluster, kafka:DescribeClusterV2, kafka:GetBootstrapBrokers]
            Resource: "*"
          - Effect: Allow
            Action:
              - kafka-cluster:Connect
              - kafka-cluster:DescribeCluster
              - kafka-cluster:DescribeClusterDynamicConfiguration
              - kafka-cluster:DescribeGroup
              - kafka-cluster:AlterGroup
              - kafka-cluster:DescribeTopic
              - kafka-cluster:ReadData
            Resource:
              - !Ref MskCluster
              - !Sub arn:aws:kafka:${AWS::Region}:${AWS::AccountId}:topic/${AWS::StackName}-msk/*
              - !Sub arn:aws:kafka:${AWS::Region}:${AWS::AccountId}:group/${AWS::StackName}-msk/*
          - Effect: Allow
            Action: mq:DescribeBroker
            Resource: "*"
          - Effect: Allow
            Action: [rds:DescribeDBClusters, rds:DescribeDBClusterParameters, rds:DescribeDBSubnetGroups]
            Resource: "*"
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref MskScramSecret
              - !Ref MqCredsSecret
              - !Ref DocdbSecret
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt MskKmsKey.Arn

  # On-demand Kafka/MQ/DocumentDB event source mappings invoke the function
  # through a path in this VPC; with no NAT gateway, PrivateLink endpoints to
  # Lambda, STS, and Secrets Manager are required (see
  # https://docs.aws.amazon.com/lambda/latest/dg/with-msk-cluster-network.html).
  # The self-referencing security group rule covers the required 443 ingress.
  VpceLambda:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasBrokers
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref VpcDefaultSg]
      PrivateDnsEnabled: true
  VpceSts:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasBrokers
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref VpcDefaultSg]
      PrivateDnsEnabled: true
  VpceSecretsManager:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasBrokers
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref VpcDefaultSg]
      PrivateDnsEnabled: true

  # MSK (provisioned, smallest brokers, SASL/SCRAM + IAM)
  MskKmsKey:
    Type: AWS::KMS::Key
    Condition: HasBrokers
    Properties:
      Description: !Sub ${AWS::StackName} MSK SCRAM secret key (AmazonMSK_ secrets require a customer-managed key)
      PendingWindowInDays: 7
  MskScramSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasBrokers
    Properties:
      Name: !Sub AmazonMSK_${AWS::StackName}
      KmsKeyId: !Ref MskKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "middy"}'
        GenerateStringKey: password
        ExcludePunctuation: true
  MskConfiguration:
    Type: AWS::MSK::Configuration
    Condition: HasBrokers
    Properties:
      Name: !Sub ${AWS::StackName}-msk-config
      ServerProperties: |
        auto.create.topics.enable=true
        default.replication.factor=2
        min.insync.replicas=1
  MskCluster:
    Type: AWS::MSK::Cluster
    Condition: HasBrokers
    Properties:
      ClusterName: !Sub ${AWS::StackName}-msk
      # 3.9.x is MSK's recommended long-support version (3.6.0 hit MSK end of
      # support 2026-06-01); the literal ".x" suffix is MSK's version naming
      KafkaVersion: 3.9.x
      NumberOfBrokerNodes: 2
      ConfigurationInfo:
        Arn: !Ref MskConfiguration
        Revision: 1
      BrokerNodeGroupInfo:
        InstanceType: kafka.t3.small
        ClientSubnets: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroups: [!Ref VpcDefaultSg]
        StorageInfo: { EBSStorageInfo: { VolumeSize: 10 } }
      ClientAuthentication:
        Sasl:
          Scram: { Enabled: true }
          Iam: { Enabled: true }
      EncryptionInfo:
        EncryptionInTransit: { ClientBroker: TLS, InCluster: true }
  MskScramAssoc:
    Type: AWS::MSK::BatchScramSecret
    Condition: HasBrokers
    Properties:
      ClusterArn: !Ref MskCluster
      SecretArnList: [!Ref MskScramSecret]
  FnMsk:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-msk-standard
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: msk.standard } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmMsk:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasBrokers
    DependsOn: BrokerAccessPolicy
    Properties:
      EventSourceArn: !Ref MskCluster
      FunctionName: !Ref FnMsk
      Topics: [middy-capture]
      StartingPosition: TRIM_HORIZON
      BatchSize: 100
  # kafka.self-managed reuses the MSK cluster's SASL/SCRAM bootstrap brokers.
  # The bootstrap broker string is not resolvable in CloudFormation
  # (GetBootstrapBrokers is API-only), so trigger.mjs creates/deletes the
  # SelfManagedEventSource mapping onto this function at run time.
  FnKafkaSelf:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-kafka-self-managed
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: kafka.self-managed } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };

  # Amazon MQ (both engines, single-instance micro, private)
  MqCredsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasBrokers
    Properties:
      Name: !Sub ${AWS::StackName}/mq-creds
      SecretString: !Sub '{"username": "middy", "password": "middyevents-${AWS::AccountId}"}'
  ActiveMqBroker:
    Type: AWS::AmazonMQ::Broker
    Condition: HasBrokers
    Properties:
      BrokerName: !Sub ${AWS::StackName}-activemq
      EngineType: ACTIVEMQ
      EngineVersion: "5.19"
      HostInstanceType: mq.t3.micro
      DeploymentMode: SINGLE_INSTANCE
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      SubnetIds: [!Ref SubnetA]
      SecurityGroups: [!Ref VpcDefaultSg]
      Users: [{ Username: middy, Password: !Sub "middyevents-${AWS::AccountId}" }]
  RabbitMqBroker:
    Type: AWS::AmazonMQ::Broker
    Condition: HasBrokers
    Properties:
      BrokerName: !Sub ${AWS::StackName}-rabbitmq
      EngineType: RABBITMQ
      EngineVersion: "3.13"
      HostInstanceType: mq.t3.micro
      DeploymentMode: SINGLE_INSTANCE
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      SubnetIds: [!Ref SubnetA]
      SecurityGroups: [!Ref VpcDefaultSg]
      Users: [{ Username: middy, Password: !Sub "middyevents-${AWS::AccountId}" }]
  FnAmq:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-mq-activemq
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: mq.activemq } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmAmq:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasBrokers
    DependsOn: BrokerAccessPolicy
    Properties:
      EventSourceArn: !GetAtt ActiveMqBroker.Arn
      FunctionName: !Ref FnAmq
      Queues: [MIDDY.QUEUE]
      BatchSize: 10
      SourceAccessConfigurations:
        - { Type: BASIC_AUTH, URI: !Ref MqCredsSecret }
  FnRmq:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-mq-rabbitmq
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: mq.rabbitmq } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmRmq:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasBrokers
    DependsOn: BrokerAccessPolicy
    Properties:
      EventSourceArn: !GetAtt RabbitMqBroker.Arn
      FunctionName: !Ref FnRmq
      Queues: [middy-capture]
      BatchSize: 10
      SourceAccessConfigurations:
        - { Type: BASIC_AUTH, URI: !Ref MqCredsSecret }
        - { Type: VIRTUAL_HOST, URI: / }

  # DocumentDB change streams
  DocdbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasBrokers
    Properties:
      Name: !Sub ${AWS::StackName}/docdb
      GenerateSecretString:
        SecretStringTemplate: '{"username": "middy"}'
        GenerateStringKey: password
        ExcludePunctuation: true
  DocdbSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Condition: HasBrokers
    Properties:
      DBSubnetGroupDescription: middy-events
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  # TLS disabled so the broker-writer needs no CA bundle (VPC-internal,
  # ephemeral test cluster)
  DocdbParams:
    Type: AWS::DocDB::DBClusterParameterGroup
    Condition: HasBrokers
    Properties:
      Description: middy-events (tls disabled)
      Family: docdb5.0
      Parameters: { tls: disabled }
  DocdbCluster:
    Type: AWS::DocDB::DBCluster
    Condition: HasBrokers
    Properties:
      DBClusterIdentifier: !Sub ${AWS::StackName}-docdb
      EngineVersion: 5.0.0
      MasterUsername: middy
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DocdbSecret}:SecretString:password}}"
      DBClusterParameterGroupName: !Ref DocdbParams
      DBSubnetGroupName: !Ref DocdbSubnetGroup
      VpcSecurityGroupIds: [!Ref VpcDefaultSg]
      StorageEncrypted: true
  DocdbInstance:
    Type: AWS::DocDB::DBInstance
    Condition: HasBrokers
    Properties:
      DBClusterIdentifier: !Ref DocdbCluster
      DBInstanceClass: db.t3.medium
  FnDocdb:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-docdb-insert
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: docdb.insert } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  EsmDocdb:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasBrokers
    DependsOn: [BrokerAccessPolicy, DocdbInstance]
    Properties:
      # DocDB ESM takes the cluster ARN; AWS::DocDB::DBCluster has no ARN
      # attribute, so it is constructed (Ref returns the identifier)
      EventSourceArn: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${DocdbCluster}
      FunctionName: !Ref FnDocdb
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 10
      DocumentDBEventSourceConfig:
        DatabaseName: middy
        CollectionName: capture
        FullDocument: UpdateLookup
      SourceAccessConfigurations:
        - { Type: BASIC_AUTH, URI: !Ref DocdbSecret }
  # ProxyRole's base policy only covers ${AWS::StackName}/* secrets; the MSK
  # SCRAM secret lives under AmazonMSK_* with a customer-managed key
  BrokerWriterAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: HasBrokers
    Properties:
      PolicyName: broker-writer-access
      Roles: [!Ref ProxyRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref MskScramSecret
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt MskKmsKey.Arn

  # The one packaged function in the harness (mongodb + kafkajs), built +
  # uploaded by deploy.sh from triggers/broker-writer/ when EnableBrokers=true.
  # action=docdb: enables change streams on middy.capture, insert/update/delete.
  # action=kafka: produces JSON/text/binary records (with headers) to the topic
  # via SASL/SCRAM using the MSK secret + bootstrap brokers passed in the event.
  FnBrokerWriter:
    Type: AWS::Lambda::Function
    Condition: HasBrokers
    Properties:
      FunctionName: !Sub ${AWS::StackName}-broker-writer
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ProxyRole.Arn
      Timeout: 120
      VpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroupIds: [!Ref VpcDefaultSg]
      Environment:
        Variables:
          DOCDB_ENDPOINT: !GetAtt DocdbCluster.Endpoint
          DOCDB_SECRET_ARN: !Ref DocdbSecret
          MSK_SECRET_ARN: !Ref MskScramSecret
      Code:
        S3Bucket: !Ref BrokerWriterCodeBucket
        S3Key: !Ref BrokerWriterCodeKey

  # ---------------------------------------------------------------------------
  # Tier 3 (EnableEdge) - cloudfront.viewer-request(+body), origin-request,
  # origin-response, viewer-response
  # Lambda@Edge: us-east-1 only, no environment variables (kind is a literal),
  # versioned ARNs required, logs land in the execution region under
  # /aws/lambda/us-east-1.<fn>. Stack delete stalls until replicas purge.
  # ---------------------------------------------------------------------------
  EdgeRole:
    Type: AWS::IAM::Role
    Condition: HasEdge
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: [lambda.amazonaws.com, edgelambda.amazonaws.com] }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
  FnEdgeViewerRequest:
    Type: AWS::Lambda::Function
    Condition: HasEdge
    Properties:
      FunctionName: !Sub ${AWS::StackName}-edge-viewer-request
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EdgeRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            const cf = e.Records[0].cf;
            const kind = cf.request.body && cf.request.body.data ? "cloudfront.viewer-request-body" : "cloudfront.viewer-request";
            console.log("MIDDY_CAPTURE " + kind + " " + JSON.stringify(e));
            return cf.request;
          };
  FnEdgeViewerRequestV1:
    Type: AWS::Lambda::Version
    Condition: HasEdge
    Properties: { FunctionName: !Ref FnEdgeViewerRequest }
  FnEdgeOriginRequest:
    Type: AWS::Lambda::Function
    Condition: HasEdge
    Properties:
      FunctionName: !Sub ${AWS::StackName}-edge-origin-request
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EdgeRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE cloudfront.origin-request " + JSON.stringify(e));
            return e.Records[0].cf.request;
          };
  FnEdgeOriginRequestV1:
    Type: AWS::Lambda::Version
    Condition: HasEdge
    Properties: { FunctionName: !Ref FnEdgeOriginRequest }
  FnEdgeOriginResponse:
    Type: AWS::Lambda::Function
    Condition: HasEdge
    Properties:
      FunctionName: !Sub ${AWS::StackName}-edge-origin-response
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EdgeRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE cloudfront.origin-response " + JSON.stringify(e));
            return e.Records[0].cf.response;
          };
  FnEdgeOriginResponseV1:
    Type: AWS::Lambda::Version
    Condition: HasEdge
    Properties: { FunctionName: !Ref FnEdgeOriginResponse }
  FnEdgeViewerResponse:
    Type: AWS::Lambda::Function
    Condition: HasEdge
    Properties:
      FunctionName: !Sub ${AWS::StackName}-edge-viewer-response
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EdgeRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE cloudfront.viewer-response " + JSON.stringify(e));
            return e.Records[0].cf.response;
          };
  FnEdgeViewerResponseV1:
    Type: AWS::Lambda::Version
    Condition: HasEdge
    Properties: { FunctionName: !Ref FnEdgeViewerResponse }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasEdge
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} edge capture
        PriceClass: PriceClass_100
        Origins:
          - Id: capture-origin
            # Function URL domain: https://<id>.lambda-url.<region>.on.aws/
            DomainName: !Select [2, !Split ["/", !GetAtt FnUrlNoneUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: capture-origin
          ViewerProtocolPolicy: allow-all
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed policies: CachingDisabled + AllViewerExceptHostHeader
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          LambdaFunctionAssociations:
            - { EventType: viewer-request, LambdaFunctionARN: !Ref FnEdgeViewerRequestV1, IncludeBody: true }
            - { EventType: origin-request, LambdaFunctionARN: !Ref FnEdgeOriginRequestV1 }
            - { EventType: origin-response, LambdaFunctionARN: !Ref FnEdgeOriginResponseV1 }
            - { EventType: viewer-response, LambdaFunctionARN: !Ref FnEdgeViewerResponseV1 }

  # ---------------------------------------------------------------------------
  # Tier 4 (SesDomain + HostedZoneId) - ses.receipt
  # Receipt rule set activation is API-only (no CloudFormation support);
  # deploy.sh runs `aws ses set-active-receipt-rule-set` after deploy.
  # ---------------------------------------------------------------------------
  SesIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSes
    Properties:
      EmailIdentity: !Ref SesDomain
  SesDkim1:
    Type: AWS::Route53::RecordSet
    Condition: HasSes
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "300"
      ResourceRecords: [!GetAtt SesIdentity.DkimDNSTokenValue1]
  SesDkim2:
    Type: AWS::Route53::RecordSet
    Condition: HasSes
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "300"
      ResourceRecords: [!GetAtt SesIdentity.DkimDNSTokenValue2]
  SesDkim3:
    Type: AWS::Route53::RecordSet
    Condition: HasSes
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "300"
      ResourceRecords: [!GetAtt SesIdentity.DkimDNSTokenValue3]
  SesMx:
    Type: AWS::Route53::RecordSet
    Condition: HasSes
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SesDomain
      Type: MX
      TTL: "300"
      ResourceRecords: [!Sub "10 inbound-smtp.${AWS::Region}.amazonaws.com"]
  FnSes:
    Type: AWS::Lambda::Function
    Condition: HasSes
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ses-receipt
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: ses.receipt } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermSes:
    Type: AWS::Lambda::Permission
    Condition: HasSes
    Properties:
      FunctionName: !Ref FnSes
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  SesRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Condition: HasSes
    Properties:
      RuleSetName: !Sub ${AWS::StackName}-rules
  SesRule:
    Type: AWS::SES::ReceiptRule
    Condition: HasSes
    DependsOn: PermSes
    Properties:
      RuleSetName: !Ref SesRuleSet
      Rule:
        Name: capture
        Enabled: true
        ScanEnabled: false
        Recipients: [!Ref SesDomain]
        Actions:
          - LambdaAction:
              FunctionArn: !GetAtt FnSes.Arn
              InvocationType: Event

