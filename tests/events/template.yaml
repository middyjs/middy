      Role: !GetAtt CaptureRole.Arn
      Timeout: 30
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: kinesis.windowed } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return { state: e.state || {} }; };
  EsmKinesisWindowed:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt KinesisStream.Arn
      FunctionName: !Ref FnKinesisWindowed
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 1
      TumblingWindowInSeconds: 30

  # ---------------------------------------------------------------------------
  # Kinesis Data Firehose transform - firehose.transform
  # Invocation arrives after the 60 s buffering interval.
  # ---------------------------------------------------------------------------
  FnFirehose:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-firehose-transform
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 60
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: firehose.transform } }
      Code:
        ZipFile: |
          exports.handler = async (e) => {
            console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e));
            return { records: (e.records || []).map((r) => ({ recordId: r.recordId, result: "Ok", data: r.data })) };
          };
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: firehose.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: firehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:AbortMultipartUpload, s3:GetBucketLocation, s3:GetObject, s3:ListBucket, s3:ListBucketMultipartUploads, s3:PutObject]
                Resource:
                  - !GetAtt MainBucket.Arn
                  - !Sub ${MainBucket.Arn}/*
              - Effect: Allow
                Action: [lambda:InvokeFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt FnFirehose.Arn
  FirehoseStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub ${AWS::StackName}-firehose
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt MainBucket.Arn
        Prefix: firehose-out/
        RoleARN: !GetAtt FirehoseRole.Arn
        BufferingHints: { IntervalInSeconds: 60, SizeInMBs: 1 }
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - { ParameterName: LambdaArn, ParameterValue: !GetAtt FnFirehose.Arn }
                - { ParameterName: BufferIntervalInSeconds, ParameterValue: "60" }
                - { ParameterName: BufferSizeInMBs, ParameterValue: "1" }

  # ---------------------------------------------------------------------------
  # CloudWatch Logs subscription - cwlogs.subscription
  # ---------------------------------------------------------------------------
  FeederLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AWS::StackName}/feeder
      RetentionInDays: 1
  FnCwlogs:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cwlogs-subscription
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cwlogs.subscription } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermCwlogs:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnCwlogs
      Action: lambda:InvokeFunction
      Principal: !Sub logs.${AWS::Region}.amazonaws.com
      SourceArn: !GetAtt FeederLogGroup.Arn
  CwlogsSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: PermCwlogs
    Properties:
      LogGroupName: !Ref FeederLogGroup
      FilterPattern: ""
      DestinationArn: !GetAtt FnCwlogs.Arn

  # ---------------------------------------------------------------------------
  # CloudWatch alarm direct Lambda action - cwalarm.direct
  # Trigger: SetAlarmState (no metric wait). Alarm name is deterministic so the
  # Lambda permission can reference it without a circular dependency.
  # ---------------------------------------------------------------------------
  FnCwalarm:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cwalarm-direct
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref CaptureLogGroup }
      Environment: { Variables: { KIND: cwalarm.direct } }
      Code:
        ZipFile: |
          exports.handler = async (e) => { console.log("MIDDY_CAPTURE " + process.env.KIND + " " + JSON.stringify(e)); return {}; };
  PermCwalarm:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FnCwalarm
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-alarm
  CaptureAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: PermCwalarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-alarm
      Namespace: MiddyEvents
      MetricName: Custom
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt FnCwalarm.Arn]
      OKActions: [!GetAtt FnCwalarm.Arn]

