      BatchSize: 100
      MaximumBatchingWindowInSeconds: 1
  KinesisEfoConsumer:
    Type: AWS::Kinesis::StreamConsumer
    Properties:
      StreamARN: !GetAtt KinesisStream.Arn
      ConsumerName: !Sub ${AWS::StackName}-efo
  FnKinesisEfo:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-kinesis-efo
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CaptureRole.Arn
      Timeout: 10
